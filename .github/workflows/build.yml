name: Build iOS diagnostic library
on:
  workflow_dispatch:
  push:
    paths:
      - 'Sources/**'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile arm64 iOS dylib
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p dist
          xcrun clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=14.0 \
            -fobjc-arc -fmodules -dynamiclib -O2 \
            -install_name '@rpath/Pool8Diagnostic.dylib' \
            -framework UIKit -framework Foundation \
            Sources/Diagnostic.m -o dist/Pool8Diagnostic.dylib
          file dist/Pool8Diagnostic.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: Pool8Diagnostic-arm64
          path: dist/Pool8Diagnostic.dylib
